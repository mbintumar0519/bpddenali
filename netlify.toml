[build]
  command = "bun run build"
  publish = ".next"

# Server secrets (GHL, FB CAPI) legitimately appear in server chunks/cache —
# omit those paths from secrets scanning. NEXT_PUBLIC vars are now public,
# so no key omits needed.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.netlify/.next/server/**,.netlify/.next/standalone/**,.netlify/deploy/**,.netlify/functions-internal/**,.next/cache/**"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[plugins]]
  package = "@netlify/plugin-nextjs"
